name: Build

# При каждом пуше в ветки main или master запускается сборка.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Переменные окружения (логично)
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: lint
    runs-on: ubuntu-latest
    # Разрешить пушить образы в GitHub Container Registry
    permissions:
      contents: read
      packages: write

    # Checkout — скачивает код в виртуальную машину GitHub
    # Setup Buildx — подготавливает Docker для сборки
    # Login — логинится в GitHub Container Registry (использует автоматический токен)
    # Extract metadata — генерит теги для образа (например, latest, sha-abc123)
    # Build and push — собирает образ и пушит
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
