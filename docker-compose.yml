services:
  frontend:
    build: .
    container_name: malutka-frontend
    restart: always
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-8080}:80'

  backend:
    image: clue/json-server
    container_name: malutka-backend
    restart: always
    ports:
      - '127.0.0.1:${BACKEND_PORT:-3000}:80'
    volumes:
      - ./db/db.json:/data/db.json
